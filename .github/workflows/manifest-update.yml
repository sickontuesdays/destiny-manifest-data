name: Weekly Manifest Update

permissions:
  contents: write

on:
  schedule:
    - cron: '15 18 * * 2'  # Tuesday 1:15 PM EST
    - cron: '45 18 * * 2'  # Tuesday 1:45 PM EST (retry)
    - cron: '15 19 * * 2'  # Tuesday 2:15 PM EST (retry)
  workflow_dispatch:

env:
  BUNGIE_API_KEY: ${{ secrets.BUNGIE_API_KEY }}

jobs:
  update-manifest:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Install system dependencies
      run: sudo apt-get update && sudo apt-get install -y jq

    - name: Fetch manifest metadata
      run: |
        curl -sS -H "X-API-Key: $BUNGIE_API_KEY" \
          https://www.bungie.net/Platform/Destiny2/Manifest/ \
          > manifest-response.json

        jq -e '.ErrorCode == 1' manifest-response.json

        jq -r '.Response.version' manifest-response.json > .manifest_version
        jq -r '.Response.mobileWorldContentPaths.en // .Response.jsonWorldContentPaths.en' \
          manifest-response.json > .manifest_url

    - name: Download manifest
      run: |
        curl -fSL "https://www.bungie.net$(cat .manifest_url)" -o manifest.content

    - name: Install Node dependencies
      run: npm install sql.js jszip --no-save

    - name: Convert manifest
      run: |
        node --max-old-space-size=6144 .github/workflows/full-convert-and-optimize.js manifest.content

    - name: Commit results
      run: |
        git config user.name "GitHub Action"
        git config user.email "action@github.com"
        git add -A -- '*.json'
        git commit -m "Auto-update manifest $(cat .manifest_version)" || exit 0
        git push
        
